[project]
name = "crm-highlevel"
version = "0.1.0"
description = "Read-only HighLevel CRM MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.scripts]
crm-highlevel = "crm_highlevel.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_highlevel"]
