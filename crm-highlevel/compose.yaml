services:
  crm-highlevel:
    build: .
    restart: unless-stopped
    environment:
      CRM_CTOX_TOKEN: ${CRM_CTOX_TOKEN:?CRM_CTOX_TOKEN is not set}
      CRM_CTOX_LOCATION_ID: ${CRM_CTOX_LOCATION_ID:?CRM_CTOX_LOCATION_ID is not set}
      CRM_HIGHLEVEL_APP_URL: ${CRM_HIGHLEVEL_APP_URL:-https://crm.ctox.com}
      CRM_HIGHLEVEL_ENABLE_WRITES: ${CRM_HIGHLEVEL_ENABLE_WRITES:-0}
    ports:
      - "127.0.0.1:8811:8811"
